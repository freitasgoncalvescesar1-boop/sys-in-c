name: Build Kernel ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gcc-multilib binutils grub-pc-bin grub-common xorriso mtools

      - name: Build Kernel Binary and ISO
        run: |
          # Compila Assembly
          gcc -m32 -c test_os/boot.s -o test_os/boot.o
          gcc -m32 -c test_os/interrupts.s -o test_os/interrupts.o

          # Compila C sem PIC/PIE
          gcc -m32 -ffreestanding -fno-pic -fno-pie -O2 -Wall -Wextra -c freestanding/kmem.c -o test_os/kmem.o
          gcc -m32 -ffreestanding -fno-pic -fno-pie -O2 -Wall -Wextra -c freestanding/kfixed.c -o test_os/kfixed.o
          gcc -m32 -ffreestanding -fno-pic -fno-pie -O2 -Wall -Wextra -c freestanding/kprintf.c -o test_os/kprintf.o
          gcc -m32 -ffreestanding -fno-pic -fno-pie -O2 -Wall -Wextra -c freestanding/kgfx.c -o test_os/kgfx.o
          gcc -m32 -ffreestanding -fno-pic -fno-pie -O2 -Wall -Wextra -c freestanding/kstring.c -o test_os/kstring.o
          gcc -m32 -ffreestanding -fno-pic -fno-pie -O2 -Wall -Wextra -c freestanding/kvfs.c -o test_os/kvfs.o
          gcc -m32 -ffreestanding -fno-pic -fno-pie -O2 -Wall -Wextra -c test_os/gdt.c -o test_os/gdt.o
          gcc -m32 -ffreestanding -fno-pic -fno-pie -O2 -Wall -Wextra -c test_os/idt.c -o test_os/idt.o
          gcc -m32 -ffreestanding -fno-pic -fno-pie -O2 -Wall -Wextra -c test_os/ps2.c -o test_os/ps2.o
          gcc -m32 -ffreestanding -fno-pic -fno-pie -O2 -Wall -Wextra -c test_os/kernel.c -o test_os/kernel.o

          # Linka o Binário
          gcc -m32 -ffreestanding -fno-pie -nostdlib -T test_os/linker.ld test_os/boot.o test_os/interrupts.o test_os/kmem.o test_os/kfixed.o test_os/kprintf.o test_os/kgfx.o test_os/kstring.o test_os/kvfs.o test_os/gdt.o test_os/idt.o test_os/ps2.o test_os/kernel.o -o test_os/myos.bin -lgcc

          # Verifica Multiboot1
          grub-file --is-x86-multiboot test_os/myos.bin

          # Estrutura GRUB
          mkdir -p isodir/boot/grub
          cp test_os/myos.bin isodir/boot/myos.bin
          cp test_os/grub.cfg isodir/boot/grub/grub.cfg

          # Gera ISO
          grub-mkrescue -o test_os.iso isodir

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test_os-bootable-iso
          path: test_os.iso
