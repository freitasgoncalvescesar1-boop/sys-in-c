name: Build test_os Bootable ISO

on:
  push:
    paths:
      - 'test_os/**'
      - 'freestanding/**'
      - '.github/workflows/build-iso.yml'
  pull_request:
    paths:
      - 'test_os/**'
      - 'freestanding/**'
  workflow_dispatch:

jobs:
  build-kernel-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Instalar Dependencias de Compilacao x86 e GRUB
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib \
            binutils \
            xorriso \
            grub-pc-bin \
            grub-common \
            mtools

      - name: Executar Build do Kernel e da ISO
        run: |
          bash test_os/build_iso.sh

      - name: Upload da ISO como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: test_os-bootable-iso
          path: myos.iso
          retention-days: 14
